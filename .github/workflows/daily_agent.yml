name: Daily Lead Agent

on:
  schedule:
    # Runs at 13:05 UTC (9:05 AM EDT) and 14:05 UTC (9:05 AM EST)
    # Uses two separate standard cron lines and checks America/New_York timezone
    # so it runs once daily at 9 AM ET year-round.
    - cron: '5 13 * * *'
    - cron: '5 14 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/daily_agent.yml'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days back to process leads'
        required: false
        default: '2'

jobs:
  run-lead-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check Eastern Time Schedule (9 AM ET)
        id: tz_check
        run: |
          ET_HOUR=$(TZ="America/New_York" date +%H)
          echo "Current Eastern Time hour: $ET_HOUR (Event: ${{ github.event_name }})"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Skipping lead agent on workflow file push event."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$ET_HOUR" != "09" ]; then
            echo "Skipping scheduled run outside the 9 AM ET window (current ET hour: $ET_HOUR)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Secrets & Setup Service Account
        if: steps.tz_check.outputs.should_run == 'true'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret SERVICE_ACCOUNT_JSON is missing! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$GMAIL_USER" ]; then
            echo "::error::Secret GMAIL_USER is missing! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$GMAIL_PASS" ]; then
            echo "::error::Secret GMAIL_APP_PASSWORD is missing! Please add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json
          echo "Service account credentials file created successfully."

      - name: Run Daily Lead Agent
        if: steps.tz_check.outputs.should_run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}
          SERVICE_ACCOUNT_FILE: service_account.json
          MASTER_SHEET_URL: ${{ secrets.MASTER_SHEET_URL }}
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then
            DAYS="2"
          fi
          echo "Running Lead Agent for the last $DAYS days..."
          python main.py --days "$DAYS"
