<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client | Performance Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #CE472D;
            /* Netgain Agency Orange */
            --bg: #ECE3D6;
            /* Signature Beige Background */
            --card-bg: #FFFFFF;
            --text-main: #231F20;
            /* Brand Off-Black */
            --text-sub: #5C5858;
            --navy: #102645;
            /* Brand Deep Navy */
            --border: rgba(0, 0, 0, 0.08);
            --radius-large: 100px;
            /* Fluid Netgain Radius */
            --radius-pill: 50px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header-logo {
            width: 110px;
            margin-bottom: 30px;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            margin: 0;
            color: var(--navy);
            letter-spacing: -2px;
            line-height: 1;
        }

        header h1 em {
            font-style: italic;
            color: var(--primary);
            font-weight: 300;
        }

        .section-wrap {
            background: var(--card-bg);
            padding: 60px;
            border-top-left-radius: 120px;
            box-shadow: 0 40px 100px -20px rgba(16, 38, 69, 0.08);
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            margin-top: 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .alert-box {
            background: #F9F7F4;
            border-left: 4px solid var(--primary);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 18px 24px;
            border-radius: 100px;
            border: 1px solid #D1CAC0;
            background-color: transparent;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 10px 30px -10px rgba(206, 71, 45, 0.15);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button,
        .btn-cancel {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        button:hover {
            transform: scale(1.02);
            background-color: #B53A22;
            box-shadow: 0 20px 40px -10px rgba(181, 58, 34, 0.3);
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid #D1CAC0;
        }

        .btn-cancel:hover {
            background-color: #f0f0f0;
            transform: scale(1.02);
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="/">
                <img src="/static/pal_logo.png" alt="PAL Logo" class="header-logo">
            </a>
            <h1>Edit <em>Client</em></h1>
        </header>

        <section class="section-wrap">
            <div class="card">
                <h2>✏️ Update Client Information</h2>
                <div class="alert-box">
                    <p style="margin: 0; font-size: 0.95rem; line-height: 1.6;">
                        <strong>🔔 Note:</strong> Changing the client name will not affect the client ID. Historical
                        data will remain intact.
                    </p>
                </div>

                <form action="/edit_client/{{ client.client_id }}" method="post">
                    <div class="form-group">
                        <label for="client_name">Company Identity</label>
                        <input type="text" id="client_name" name="client_name" value="{{ client.client_name }}"
                            required>
                    </div>
                    <div class="form-group">
                        <label for="search_keywords">Search Keywords</label>
                        <input type="text" id="search_keywords" name="search_keywords"
                            value="{{ ', '.join(client.search_keywords) }}" required>
                    </div>
                    <div class="form-group">
                        <label for="report_recipient">Report Logistics (Emails)</label>
                        <input type="text" id="report_recipient" name="report_recipient"
                            value="{{ client.report_recipient }}" required>
                    </div>
                    <div class="form-group">
                        <label for="sheet_url">Google Sheet Access URL</label>
                        <input type="url" id="sheet_url" name="sheet_url" value="{{ client.sheet_url }}" required>
                    </div>
                    <div class="form-group">
                        <label for="sheet_name">Display Alias (Optional)</label>
                        <input type="text" id="sheet_name" name="sheet_name" value="{{ client.sheet_name or '' }}">
                    </div>
                    <div class="button-group">
                        <a href="/" class="btn-cancel">Cancel</a>
                        <button type="submit">Save Changes</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
